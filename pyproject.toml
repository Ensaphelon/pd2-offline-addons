[project]
name = "pd2-offline-addons"
version = "0.1.0"
description = "Offline add-ons for Project Diablo 2: one DLL, one patch, toggled in the pause menu"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
pd2-offline-addons = "pd2_offline_addons.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pd2_offline_addons"]
